name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1); fi
          if [ -n "$XC" ]; then
            echo "Using $XC"
            sudo xcode-select -s "$XC"
          else
            echo "No Xcode 15/16 found, using the default"
          fi
          clang --version

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_AFTER_BUILD=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Sign and package
        run: |
          codesign --force --deep -s - "build/LiveFX_artefacts/Release/VST3/LiveFX Performer 2.vst3"
          ditto -c -k --sequesterRsrc --keepParent "build/LiveFX_artefacts/Release/VST3/LiveFX Performer 2.vst3" LiveFX-Performer-2-macOS.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LiveFX-VST3-macOS
          path: LiveFX-Performer-2-macOS.zip
