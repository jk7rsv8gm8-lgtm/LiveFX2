name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - os: windows-latest
            name: Windows
            extra: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_AFTER_BUILD=OFF ${{ matrix.extra }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: LiveFX-VST3-${{ matrix.name }}
          path: build/LiveFX_artefacts/Release/VST3
